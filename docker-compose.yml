version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: vms_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vms_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vms_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vms_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-vms_db}?schema=public
      - DIRECT_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-vms_db}?schema=public
      - PORT=5000
      # Add other required environment variables for your backend here (like JWT_SECRET, RESEND_API_KEY, etc.)
    ports:
      - "5000:5000"
    depends_on:
      - db
    # We use a command to ensure Prisma migrations run before starting the server
    command: sh -c "npx prisma migrate deploy && npm start"
    networks:
      - vms_network

  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: vms_python_service
    restart: always
    environment:
      # Add required environment variables here (like OPENAI_API_KEY)
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    networks:
      - vms_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vms_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - vms_network

volumes:
  postgres_data:

networks:
  vms_network:
    driver: bridge
